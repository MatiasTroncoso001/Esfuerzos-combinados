    <!-- =========================================================
         RESULTADOS DE APRENDIZAJE
         ========================================================= -->
    <meta
      name="learning-outcome"
      content="RA1: Analizar la distribución de tensiones normales (σ) y cortantes (τ) originadas por esfuerzos combinados (axial N, cortantes Vy/Vz, flexión Mz y torsión T) en secciones prismáticas."
    />
    <meta
      name="learning-outcome"
      content="RA2: Determinar e interpretar el tensor tridimensional de tensiones en cualquier punto discretizado de la sección transversal mallada."
    />
    <meta
      name="learning-outcome"
      content="RA3: Construir e interpretar el Círculo de Mohr, deduciendo autovalores principales (σ₁, σ₂, σ₃), tensiones cortantes máximas (τmáx) y el esfuerzo equivalente de Von Mises."
    />
    <meta
      name="learning-outcome"
      content="RA4: Comprender el comportamiento del eje longitudinal neutro x pasante y la orientación espacial de las solicitaciones mediante proyecciones diédricas e isométricas normalizadas."
    />
